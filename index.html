<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eunseo Jang</title>
  <meta name="description" content="Eunseo Jang, MA student in Economics at Seoul National University.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1f2328;
      --muted: #6b7280;
      --faint: #a8adb5;
      --rule: #dfe2e6;
      --link: #1f4e79;
      --paper: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.65;
    }

    .page {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }

    a { color: var(--link); text-decoration: none; }
    a:hover, a:focus-visible { text-decoration: underline; }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--rule);
    }

    .site-name {
      color: var(--ink);
      font-size: 22px;
      font-weight: 600;
    }
    .site-name:hover { text-decoration: none; }

    nav {
      display: flex;
      gap: 24px;
      font-size: 17px;
    }
    nav a { color: var(--ink); }
    nav a[aria-current="page"] { font-weight: 600; }

    main {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 40px;
      margin-top: 44px;
      align-items: start;
    }

    .portrait {
      display: block;
      width: 220px;
      height: 275px;
      object-fit: cover;
      border-radius: 2px;
    }

    .intro p { margin: 0 0 16px; }
    .intro .affiliation { margin-top: 32px; color: var(--muted); }

    .contact {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 22px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--rule);
      font-size: 17px;
    }

    @media (max-width: 620px) {
      .page { padding: 28px 16px 48px; }
      header { flex-direction: column; gap: 6px; }
      main { grid-template-columns: 1fr; gap: 24px; margin-top: 28px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="site-name" href="index.html">Eunseo Jang</a>
      <nav aria-label="Main">
        <a href="index.html" aria-current="page">Home</a>
        <!-- To add a Research page later: <a href="research.html">Research</a> -->
        <a href="cv.pdf" target="_blank" rel="noopener">CV</a>
      </nav>
    </header>

    <main>
      <img class="portrait" src="photo.jpg" alt="Portrait of Eunseo Jang">

      <section class="intro">
        <p>Hi, I am a first-year MA student in Economics at Seoul National University. My research interests are industrial organization, behavioral finance, and corporate finance.</p>
        <p class="affiliation">Department of Economics<br>Seoul National University</p>

        <div class="contact">
          <a href="mailto:kirstinjang@snu.ac.kr">kirstinjang@snu.ac.kr</a>
          <a href="https://www.linkedin.com/in/eunseo-jang-104975338/" target="_blank" rel="noopener">LinkedIn</a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
